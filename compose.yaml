# Local cockpit. The mounted repo is the project agents work in.
# CEZ_DRY_RUN=1 uses the built-in mock so the stack boots without a logged-in agent CLI.
# Point CEZ_REPO at another checkout, or set CEZ_DRY_RUN=0 and CEZ_REAL_AGENTS=1
# for the experimental subprocess runner (see MIGRATION.md).
services:
  cezar:
    build: .
    ports:
      - "4321:4321"
    environment:
      PROJECT_DATA_DIR: /data
      CEZ_REPO: /repo
      CEZ_DRY_RUN: "1"
      STARIO_HOST: 0.0.0.0
      STARIO_PORT: "4321"
    volumes:
      - cezar-data:/data
      - .:/repo
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:4321/health')",
        ]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  cezar-data:
